<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:CB;src:url(fonts/Cairo-Black.ttf);}
@font-face{font-family:CBD;src:url(fonts/Cairo-Bold.ttf);}
@font-face{font-family:CR;src:url(fonts/Cairo-Regular.ttf);}
@font-face{font-family:CS;src:url(fonts/Cairo-SemiBold.ttf);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;overflow:hidden;}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;direction:rtl;
 background:radial-gradient(120% 90% at 50% 30%,#211d18 0%,#16130f 48%,#0c0a08 100%);}
.grain{position:absolute;inset:0;background-image:url(grain.png);background-size:600px 340px;opacity:.06;mix-blend-mode:overlay;z-index:20;}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 380px 90px rgba(0,0,0,.72);z-index:19;}
@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes upS{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sweep{0%{transform:translateX(-140%) skewX(-18deg)}100%{transform:translateX(240%) skewX(-18deg)}}
</style></head>
<body><div id="stage">
<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
 <div style="font-family:CB;font-size:150px;color:#e6bd6f;letter-spacing:4px;opacity:0;animation:pop 1s cubic-bezier(.2,.8,.2,1) .1s forwards;">برق</div>
 <div style="font-family:CR;color:#c9b89c;font-size:42px;margin-top:6px;opacity:0;animation:upS .9s ease .7s forwards;">عقلٌ يقودُ طاقتك</div>
 <div style="margin-top:66px;position:relative;overflow:hidden;border-radius:22px;opacity:0;animation:pop .9s ease 1.1s forwards;">
   <div style="padding:34px 78px;border-radius:22px;background:linear-gradient(180deg,#ffe08a,#d9a441);font-family:CB;font-size:78px;color:#1a140a;letter-spacing:3px;box-shadow:0 12px 40px rgba(217,164,65,.4);">0936177050</div>
   <div style="position:absolute;top:0;left:0;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sweep 2.4s ease-in-out 1.8s infinite;"></div>
 </div>
 <div style="margin-top:34px;font-family:CS;font-size:40px;color:#e9dcc2;opacity:0;animation:upS .8s ease 1.5s forwards;">للطلب والاستفسار — اتصل الآن</div>
 <div style="margin-top:54px;display:flex;align-items:center;gap:18px;opacity:0;animation:fade 1s ease 1.9s forwards;">
   <svg width="60" height="40" viewBox="0 0 90 60"><rect width="90" height="20" fill="#007A3D"/><rect width="90" height="20" y="20" fill="#fff"/><rect width="90" height="20" y="40" fill="#000"/>
   <polygon points="24,23.5 25.53,28.2 30.47,28.2 26.47,31.1 28,35.8 24,32.9 20,35.8 21.53,31.1 17.53,28.2 22.47,28.2" fill="#CE1126"/>
   <polygon points="45,23.5 46.53,28.2 51.47,28.2 47.47,31.1 49,35.8 45,32.9 41,35.8 42.53,31.1 38.53,28.2 43.47,28.2" fill="#CE1126"/>
   <polygon points="66,23.5 67.53,28.2 72.47,28.2 68.47,31.1 70,35.8 66,32.9 62,35.8 63.53,31.1 59.53,28.2 64.47,28.2" fill="#CE1126"/></svg>
   <span style="font-family:CBD;font-size:46px;color:#fff;">صناعة سورية</span>
 </div>
</div>
<div class="vig"></div><div class="grain"></div>
</div></body></html>
