<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden;}#c{display:block;}</style>
<script src="glbdata.js"></script>
<script type="importmap">
{ "imports": {
  "three": "./package/build/three.module.js",
  "three/addons/": "./package/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W=1080, H=1920;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, preserveDrawingBuffer:true});
renderer.setSize(W,H,false);
renderer.setPixelRatio(1);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera=new THREE.PerspectiveCamera(35, W/H, 0.1, 100);

// lighting: key + rim + fill for a premium product look
const key=new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(3,5,4); scene.add(key);
const rim=new THREE.DirectionalLight(0xbfd8ff, 1.8); rim.position.set(-4,2,-3); scene.add(rim);
const fill=new THREE.DirectionalLight(0xffe6b0, 1.0); fill.position.set(-2,-1,3); scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

const pivot=new THREE.Group(); scene.add(pivot);
let ready=false, radius=3;

const loader=new GLTFLoader();
loader.load(window.GLB_URI, (gltf)=>{
  const model=gltf.scene;
  // center on bounding sphere & normalize scale
  let box=new THREE.Box3().setFromObject(model);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  model.position.sub(center);
  const maxDim=Math.max(size.x,size.y,size.z);
  const scale=2.0/maxDim; model.scale.setScalar(scale);
  pivot.add(model);
  box=new THREE.Box3().setFromObject(pivot);
  const sph=box.getBoundingSphere(new THREE.Sphere());
  window.__r=sph.radius;
  ready=true; window.__ready=true;
  window.__info={size:[size.x,size.y,size.z], maxDim, r:sph.radius};
  window.setCam(28, 0.62, -0.28); // default: elevation deg, fitMul, targetY(units)
}, undefined, (err)=>{ window.__error=String(err); });

// elevDeg: camera elevation angle; fitMul: framing tightness (smaller=tighter); targetYr: lookAt y as fraction of r
window.setCam=function(elevDeg, fitMul, targetYr){
  const r=window.__r; const fov=camera.fov*Math.PI/180;
  const dist=(r/Math.sin(fov/2))*fitMul;
  const el=elevDeg*Math.PI/180;
  camera.position.set(0, Math.sin(el)*dist, Math.cos(el)*dist);
  camera.lookAt(0, targetYr*r, 0);
};
window.renderAt=function(angleRad, tiltRad){
  pivot.rotation.y=angleRad;
  pivot.rotation.x=(tiltRad||0);
  renderer.render(scene,camera);
};
</script>
</body></html>
